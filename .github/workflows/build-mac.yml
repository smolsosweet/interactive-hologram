name: 🍎 Release OTA (macOS)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release-mac:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🗑️ Remove .npmrc (Fix mirror 404 issue)
        run: rm -f .npmrc
        
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build and Publish macOS .dmg
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
