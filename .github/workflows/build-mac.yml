# ============================================================
# 🍎 BUILD macOS — GitHub Actions Workflow
# ============================================================
# File này ra lệnh cho SERVER ẢO CỦA GITHUB (chạy macOS thật!)
# tự động clone repo, cài dependencies, và build ra file .dmg
#
# Kích hoạt: Mỗi khi bạn push code lên nhánh "main"
#            HOẶC bấm nút "Run workflow" thủ công trên GitHub
# ============================================================

name: 🍎 Build macOS (.dmg)

on:
  # Tự động chạy khi push lên nhánh main
  push:
    branches: [ main ]

  # Cho phép bấm nút chạy thủ công trên GitHub
  workflow_dispatch:

jobs:
  build-mac:
    # 👉 ĐÂY LÀ DÒNG QUAN TRỌNG NHẤT:
    # Yêu cầu GitHub cấp cho ta một con máy Mac ảo (miễn phí!)
    runs-on: macos-latest

    steps:
      # Bước 1: Clone repo về máy Mac ảo
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # Bước 2: Cài Node.js trên máy Mac ảo
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bước 3: Cài tất cả dependencies (npm install)
      - name: 📦 Install dependencies
        run: npm ci

      # Bước 4: Build ra file .dmg
      - name: 🔨 Build macOS .dmg
        run: npm run build:mac
        env:
          # Bỏ qua code signing (vì ta không có Apple Developer Account)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Bước 5: Upload file .dmg lên GitHub để bạn tải về
      - name: 📤 Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solar-System-Hologram-macOS
          path: dist/*.dmg
          retention-days: 30
